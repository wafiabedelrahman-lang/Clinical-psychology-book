<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b78"/></marker></defs><rect width="860" height="400" fill="#ffffff"/><rect x="400" y="330" width="420" height="48" rx="10" fill="#eef1f4" stroke="#4a5a68" stroke-width="1.5"/><text x="680" y="354.0" font-size="13.5" fill="#4a5a68" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">1. علامات الإنذار الخاصة بي</text><text x="495" y="354.0" font-size="11.5" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">أفكار، مشاعر، مواقف</text><rect x="364" y="272" width="420" height="48" rx="10" fill="#e5f3f1" stroke="#2b7f78" stroke-width="1.5"/><text x="644" y="296.0" font-size="13.5" fill="#2b7f78" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">2. ما أفعله وحدي لأهدأ</text><text x="459" y="296.0" font-size="11.5" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">تنفس، صلاة، مشي، كتابة</text><rect x="328" y="214" width="420" height="48" rx="10" fill="#e6f0f5" stroke="#1f5f7a" stroke-width="1.5"/><text x="608" y="238.0" font-size="13.5" fill="#1f5f7a" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">3. أماكن وأشخاص يشغلونني</text><text x="423" y="238.0" font-size="11.5" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">جار، مسجد، صديق</text><rect x="292" y="156" width="420" height="48" rx="10" fill="#eeecf8" stroke="#5b4f99" stroke-width="1.5"/><text x="572" y="180.0" font-size="13.5" fill="#5b4f99" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">4. من أطلب منه المساعدة</text><text x="387" y="180.0" font-size="11.5" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">أسماء وأرقام</text><rect x="256" y="98" width="420" height="48" rx="10" fill="#fbf1e2" stroke="#b7792a" stroke-width="1.5"/><text x="536" y="122.0" font-size="13.5" fill="#b7792a" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">5. المختصون وخطوط الطوارئ</text><text x="351" y="122.0" font-size="11.5" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">الأخصائي، المؤسسة، 121</text><rect x="220" y="40" width="420" height="48" rx="10" fill="#f8e9ee" stroke="#a2475e" stroke-width="1.5"/><text x="500" y="64.0" font-size="13.5" fill="#a2475e" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">6. جعل المحيط أكثر أمانًا</text><text x="315" y="64.0" font-size="11.5" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">إبعاد الوسائل بمساعدة الأسرة</text><line x1="250" y1="370" x2="90" y2="50" stroke="#1f5f7a" stroke-width="2.5" marker-end="url(#arr)"/><text x="110" y="221.9" font-size="12.5" fill="#1f5f7a" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">نصعد درجة</text><text x="110" y="240.0" font-size="12.5" fill="#1f5f7a" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">إذا لم تكفِ</text><text x="110" y="258.1" font-size="12.5" fill="#1f5f7a" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">الدرجة السابقة</text><text x="430" y="392.0" font-size="12" fill="#5b6b78" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">تُكتب بكلمات العميل، ويحتفظ بنسخة منها، وتُراجع في كل جلسة</text></svg>