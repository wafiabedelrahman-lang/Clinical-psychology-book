<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="860" height="170" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b78"/></marker></defs><rect width="860" height="170" fill="#ffffff"/><rect x="655" y="45" width="185" height="64" rx="10" fill="#e5f3f1" stroke="#2b7f78" stroke-width="1.5"/><text x="747.5" y="77.0" font-size="13.5" fill="#2b7f78" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">«بقيت ثلاث جلسات»</text><line x1="652" y1="77" x2="633" y2="77" stroke="#5b6b78" stroke-width="2" marker-end="url(#arr)"/><rect x="445" y="45" width="185" height="64" rx="10" fill="#e6f0f5" stroke="#1f5f7a" stroke-width="1.5"/><text x="537.5" y="77.0" font-size="13.5" fill="#1f5f7a" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">«بقيت جلستان»</text><line x1="442" y1="77" x2="423" y2="77" stroke="#5b6b78" stroke-width="2" marker-end="url(#arr)"/><rect x="235" y="45" width="185" height="64" rx="10" fill="#eeecf8" stroke="#5b4f99" stroke-width="1.5"/><text x="327.5" y="77.0" font-size="13.5" fill="#5b4f99" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">«الأسبوع القادم آخر لقاء»</text><line x1="232" y1="77" x2="213" y2="77" stroke="#5b6b78" stroke-width="2" marker-end="url(#arr)"/><rect x="25" y="45" width="185" height="64" rx="10" fill="#3f7d3a" stroke="#3f7d3a" stroke-width="1.5"/><text x="117.5" y="77.0" font-size="13.5" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">جلسة الإغلاق</text><text x="430" y="145.0" font-size="12" fill="#5b6b78" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">الإنهاء المفاجئ قد يُشعر المستفيد بالتخلي؛ والعد التنازلي يمنحه فرصة لقول ما لم يقله بعد</text></svg>