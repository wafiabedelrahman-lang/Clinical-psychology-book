<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b78"/></marker></defs><rect width="860" height="230" fill="#ffffff"/><line x1="60" y1="110" x2="800" y2="110" stroke="#5b6b78" stroke-width="2"/><rect x="575" y="40" width="250" height="140" rx="10" fill="#f8e9ee" stroke="#a2475e" stroke-width="1.5"/><text x="700" y="70.0" font-size="16" fill="#a2475e" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">العطف (الشفقة)</text><text x="700" y="119.3" font-size="12" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">ينظر إليه من أعلى: «يا حرام!»</text><text x="700" y="136.7" font-size="12" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">يشعر المفحوص بالضعف</text><rect x="305" y="40" width="250" height="140" rx="10" fill="#3f7d3a" stroke="#3f7d3a" stroke-width="1.5"/><text x="430" y="70.0" font-size="16" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">التعاطف</text><text x="430" y="119.3" font-size="12" fill="#fff" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">«أفهم ما تشعر به وأقف معك»</text><text x="430" y="136.7" font-size="12" fill="#fff" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">مع بقاء المسافة المهنية</text><rect x="35" y="40" width="250" height="140" rx="10" fill="#f8e9ee" stroke="#a2475e" stroke-width="1.5"/><text x="160" y="70.0" font-size="16" fill="#a2475e" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">التماهي (التوحد)</text><text x="160" y="119.3" font-size="12" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">يذوب في مشاعره ويتألم مثله</text><text x="160" y="136.7" font-size="12" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">يفقد القدرة على المساعدة</text><text x="430" y="210.0" font-size="13" fill="#3f7d3a" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">قريب بما يكفي لتفهم، وبعيد بما يكفي لتساعد</text></svg>