<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b78"/></marker></defs><rect width="860" height="230" fill="#ffffff"/><line x1="80" y1="120" x2="780" y2="120" stroke="#5b6b78" stroke-width="3"/><circle cx="720" cy="120" r="10" fill="#4a5a68" stroke="#4a5a68" stroke-width="1.5"/><text x="720" y="80.0" font-size="15" fill="#4a5a68" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">التهرب من الواقع</text><text x="720" y="161.3" font-size="12" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">يرى التناقض ويسكت عنه</text><text x="720" y="178.7" font-size="12" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">فيُحرم المفحوص من الاستبصار</text><circle cx="430" cy="120" r="14" fill="#3f7d3a" stroke="#3f7d3a" stroke-width="1.5"/><text x="430" y="80.0" font-size="15" fill="#3f7d3a" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">مواجهة متوازنة</text><text x="430" y="161.3" font-size="12" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">تصف التناقض بهدوء</text><text x="430" y="178.7" font-size="12" fill="#1d2a3a" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">وتحفظ الكرامة وتذكّر بالقدرات</text><circle cx="140" cy="120" r="10" fill="#a2475e" st