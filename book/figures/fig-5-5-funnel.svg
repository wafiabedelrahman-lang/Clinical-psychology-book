<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b78"/></marker></defs><rect width="860" height="320" fill="#ffffff"/><path d="M50.0,20 h760 l-40,62 h-680 z" fill="#2b7f78" opacity="0.92"/><text x="430" y="51.0" font-size="13.5" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">كل من يراجع المؤسسة: يُطبَّق عليه مقياس فرز قصير</text><path d="M150.0,88 h560 l-40,62 h-480 z" fill="#1f5f7a" opacity="0.92"/><text x="430" y="119.0" font-size="13.5" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">من تجاوز نقطة القطع: «فرز إيجابي»</text><path d="M240.0,156 h380 l-40,62 h-300 z" fill="#5b4f99" opacity="0.92"/><text x="430" y="187.0" font-size="13.5" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">مقابلة إكلينيكية</text><path d="M320.0,224 h220 l-40,62 h-140 z" fill="#b7792a" opacity="0.92"/><text x="430" y="255.0" font-size="13.5" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">التشخيص أو نفيه</text><text x="430" y="306.0" font-size="12" fill="#5b6b78" font-weight="400" text-anchor="middle" dominant-baseline="middle" direction="rtl" font-family="'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif">المقياس يختصر الطريق إلى من يحتاج التقييم، ولا يغني عن المقابلة</text></svg>